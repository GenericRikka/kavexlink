# If enabled, players are teleported to the configured public warp on join.
# Manage this in-game with: /warp jointp <on|off>  and  /warp jointp warp <name>
join-teleport:
  enabled: false
  warp: spawn

# Shown in the warps GUI title, e.g. "MyServer Warps".
# Leave blank to fall back to the server's MOTD, or "Minecraft" if that's also unset.
server-name: ""

