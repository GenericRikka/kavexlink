# If enabled, players are teleported to the configured public warp on join.
# Manage this in-game with: /warp jointp <on|off>  and  /warp jointp warp <name>
join-teleport:
  enabled: false
  warp: spawn

# Shown in the warps GUI title, e.g. "MyServer Warps".
server-name: ""

# Controls the order categories appear in as you page through the warps GUI.
# List them in the order you want, e.g.:
#   category-order:
#     - Spawn
#     - Farms
#     - Structures
# Any category not listed here is appended afterward, sorted alphabetically.
# Leave this empty to sort every category alphabetically.
category-order: []

