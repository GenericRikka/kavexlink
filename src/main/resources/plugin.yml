name: KavexWarp
version: '1.0'
main: net.kavocado.kavexwarp.KavexWarpPlugin
api-version: '26.1'
description: Public and private warps with a GUI.
author: GenericRikka

commands:
  setwarp:
    description: Create or update a warp at your current location.
    usage: /setwarp <name> <public|private> [icon]
  warps:
    description: Open the warps GUI.
    usage: /warps [public|private]
  warp:
    description: Edit an existing warp, or manage join-teleport.
    usage: /warp edit <name> <rename|relocate|icon|order|delete> ... | /warp jointp <on|off> | /warp jointp warp <name>
  back:
    description: Return to your location before your last teleport.
    usage: /back

permissions:
  kavexwarp.admin:
    description: Allows editing (rename/relocate/icon/order/delete) PUBLIC warps, and implies kavexwarp.setwarp.public.
    default: op
    children:
      kavexwarp.setwarp.public: true
      kavex.setwarp.private: true
  kavexwarp.setwarp.public:
    description: Allows creating or updating PUBLIC warps via /setwarp.
    default: false
  kavexwarp.setwarp.private:
    description: Allows creating or updating your own PRIVATE warps via /setwarp.
    default: false
  kavexwarp.back:
    description: Allows using /back to return to your location before your last teleport.
    default: true
